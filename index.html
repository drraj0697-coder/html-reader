<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--ink:#0b0b0f;--mut:#8a8a8f;--line:#e4e4ea;--accent:#2d6ae3;--accent-soft:#e8f0fe;
  --pill:#ffffff;--pill-on:#e8e8ee;--dark-btn:#000000;--dark-btn-ink:#ffffff;--bar:rgba(246,246,249,.86);--shadow:0 6px 24px rgba(0,0,0,.14);--bad:#d33a2c;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Arabic','Noto Sans CJK SC',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#8e8e93;--line:#38383a;--accent:#6ea0ff;--accent-soft:#1b2944;
  --pill:#1c1c1e;--pill-on:#2c2c2e;--dark-btn:#ffffff;--dark-btn-ink:#000000;--bar:rgba(28,28,30,.86);--shadow:0 6px 24px rgba(0,0,0,.6);--bad:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#8e8e93;--line:#38383a;--accent:#6ea0ff;--accent-soft:#1b2944;
  --pill:#1c1c1e;--pill-on:#2c2c2e;--dark-btn:#ffffff;--dark-btn-ink:#000000;--bar:rgba(28,28,30,.86);--shadow:0 6px 24px rgba(0,0,0,.6);--bad:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- library screen ---------- */
#home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrapin{max-width:1100px;margin:0 auto}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:6px 0 4px}
.tabs{display:flex;background:var(--pill);border-radius:999px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.07);margin:0 auto 0 0}
.tabs button{height:44px;padding:0 22px;border-radius:999px;font-weight:500;font-size:18px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pill-on);color:var(--accent);font-weight:600}
.right{display:flex;gap:12px;align-items:center;flex:1 1 280px;justify-content:flex-end}
.addpill{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.07)}
.addpill .n{background:var(--pill-on);color:var(--mut);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px}
.plus{width:44px;height:44px;border-radius:50%;background:var(--dark-btn);color:var(--dark-btn-ink);display:grid;place-items:center}
.plus svg{width:24px;height:24px;stroke-width:2.4}
.search{flex:1 1 180px;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:999px;padding:0 18px;height:52px;box-shadow:0 2px 14px rgba(0,0,0,.07);color:var(--mut)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;-webkit-user-select:text;user-select:text;font-size:18px;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
h1{font-size:40px;line-height:1.1;margin:34px 4px 18px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border-radius:28px;overflow:hidden}
.row{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:16px 22px 16px 22px;position:relative}
.row:active{background:var(--pill-on)}
.row+.row::before{content:"";position:absolute;top:0;left:96px;right:22px;border-top:1px solid var(--line)}
.fi{width:56px;height:56px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.fi svg{width:28px;height:28px}
.tx{flex:1;min-width:0}
.nm{font-size:21px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sz{color:var(--mut);font-size:16px}
svg.i.star{color:#f4a600;width:20px;height:20px;fill:#f4a600;margin-right:2px}
.chev{color:var(--mut);opacity:.7;width:20px;height:20px}
.empty{padding:56px 24px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}
.empty .big{margin-top:18px;display:inline-flex;gap:8px;align-items:center;background:var(--dark-btn);color:var(--dark-btn-ink);height:48px;padding:0 24px;border-radius:999px;font-weight:600}
.tip{margin:18px 6px;color:var(--mut);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.tip button{margin-left:auto;color:var(--accent);font-weight:600}
.fi.dir{background:color-mix(in srgb,#f4a600 18%,transparent);color:#e39a00}
.crumb{display:inline-flex;align-items:center;gap:2px;height:40px;margin:2px 0 8px 2px;color:var(--accent);font-weight:600;font-size:19px}
.crumb svg{width:22px;height:22px;transform:scaleX(-1)}
.nm,.sz{max-width:100%}
.sz.p{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings */
.sec{margin:0 0 22px}
.sec h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px 18px;font-weight:600}
.set{display:flex;align-items:center;gap:14px;padding:15px 20px;min-height:56px;width:100%;text-align:left}
.set+.set{border-top:1px solid var(--line)}
.set .lb{flex:1}.set .lb small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.seg{display:inline-flex;background:var(--pill-on);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--pill-on);border-radius:99px;transition:background .18s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .18s}
.sw input:checked+i{background:#34c759}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.danger{color:var(--bad);font-weight:600}
select.sel{background:var(--pill-on);border:0;border-radius:10px;padding:8px 12px;font-size:16px;color:var(--ink)}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;z-index:50;background:var(--bg)}
#reader[hidden]{display:none}
#rbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line);transition:transform .22s}
#rbar .t{flex:1;text-align:center;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.14);flex:none}
#rframe{position:absolute;left:0;right:0;bottom:0;top:calc(64px + env(safe-area-inset-top,0px));background:#fff;transition:top .22s;overflow:hidden}
#rframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#reader.hide-bar #rbar{transform:translateY(-110%)}
#reader.hide-bar #rframe{top:0}
#reader.hide-bar.peek #rbar{transform:none}
.fl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));z-index:6;display:none;opacity:.55}
.fl .circ{width:40px;height:40px}
#flL{left:max(10px,env(safe-area-inset-left,0px))}#flR{right:max(10px,env(safe-area-inset-right,0px))}
#reader[data-mode="focus"] .fl{display:block}
#reader.peek .fl{display:none!important}
#grab{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:26px;z-index:6;display:none}
#grab::after{content:"";position:absolute;left:50%;top:7px;width:52px;height:5px;margin-left:-26px;border-radius:3px;background:rgba(120,120,130,.55)}
#reader[data-mode="full"] #grab{display:block}
#reader.peek #grab{display:none}

/* menus */
#layer{position:fixed;inset:0;z-index:70;cursor:pointer}.menu{cursor:default}
#layer[hidden]{display:none}
.scrim{position:absolute;inset:0}
.menus{position:absolute;top:calc(72px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;flex-direction:row-reverse}
.menu{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:8px;min-width:270px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;border-radius:18px;font-size:19px;text-align:left}
.menu button:active,.menu button.on{background:var(--pill-on)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 14px}
.menu .tick{width:20px;display:grid;place-items:center;color:var(--ink)}
.menu .go{margin-left:auto;width:18px;height:18px}
.menu .del{color:var(--bad)}
.menu .stepper{display:flex;align-items:center;gap:6px;padding:4px}
.menu .stepper button{width:auto;flex:1;justify-content:center;padding:12px 0}
.menu .stepper .pct{min-width:84px;text-align:center;font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.menu .ab{font-weight:600;font-size:17px}.menu .ab.big{font-size:28px}
.f-slider-wrap{padding:2px 0}
.f-slider-row{padding:8px 18px 14px;display:flex;align-items:center}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('hr.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('hr.'+k,JSON.stringify(v))}catch(e){}}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const fmtSize=n=>n<1024?n+' B':n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB';
const ico=(n,c)=>'<svg class="i'+(c?' '+c:'')+'"><use href="#i-'+n+'"/></svg>';
const SCRIPT_END='<\/script>';

const S={files:[],tab:'my',q:'',set:Object.assign({theme:'auto',display:'adjacent',net:true,fix:true,fmt:true,font:100},LS.get('set',{})),cur:null,sheet:null,path:[],dirList:[],dsel:null,mode:'adjacent',net:true,url:null,tip:LS.get('tipHidden',false)};

/* ---------- storage ---------- */
const DB={p:null,open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('html-reader-pwa',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
  async put(f){try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(f);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){toast('Could not save in this browser. Private browsing may block storage.')}},
  async del(id){try{const db=await this.open();db.transaction('files','readwrite').objectStore('files').delete(id)}catch(e){}},
  async clear(){try{const db=await this.open();db.transaction('files','readwrite').objectStore('files').clear()}catch(e){}},
  async all(){try{const db=await this.open();return await new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}catch(e){return[]}}};

/* ---------- theme ---------- */
function applyTheme(){const r=document.documentElement;if(S.set.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.set.theme);
  const dark=S.set.theme==='dark'||(S.set.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);$('#themeColor').setAttribute('content',dark?'#000000':'#f2f2f7')}
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
const saveSet=()=>LS.set('set',S.set);

/* ---------- library screen ---------- */
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const isiOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const clean=n=>String(n).replace(/\.(x?html?|shtml)$/i,'').replace(/_+/g,' ').replace(/\s+/g,' ').trim();
const relOf=f=>f.rel||[];
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const inPath=(f,p)=>{const r=relOf(f);return p.every((x,i)=>r[i]===x)};
function flatList(){const q=S.q.trim().toLowerCase();return S.files.filter(f=>(S.tab!=='fav'||f.fav)&&(!q||(clean(f.name)+' '+f.name+' '+relOf(f).map(clean).join(' ')).toLowerCase().includes(q))).sort((a,b)=>nat(clean(a.name),clean(b.name)))}
function browse(){const p=S.path,d=new Map(),files=[];
  for(const f of S.files){if(!inPath(f,p))continue;const r=relOf(f);if(r.length===p.length)files.push(f);else{const n=r[p.length];d.set(n,(d.get(n)||0)+1)}}
  files.sort((a,b)=>nat(clean(a.name),clean(b.name)));
  return{dirs:[...d].map(([name,count])=>({name,count,path:p.concat(name)})).sort((a,b)=>nat(clean(a.name),clean(b.name))),files}}
const fileRow=(f,sub)=>'<button class="row" data-id="'+f.id+'"><span class="fi">'+ico('doc')+'</span><span class="tx"><span class="nm">'+esc(clean(f.name))+'</span><span class="sz p">'+esc(sub)+'</span></span>'+(f.fav?ico('star','star'):'')+ico('chev','chev')+'</button>';
function render(){
  const flat=S.tab==='fav'||!!S.q.trim();
  if(S.tab==='my')while(S.path.length&&!S.files.some(f=>inPath(f,S.path)))S.path.pop();
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('#cnt').textContent=S.files.length;
  const ttl={my:S.path.length?clean(S.path[S.path.length-1]):'HTML Reader',fav:'Favorites',set:'Settings'}[S.tab];$('#ttl').textContent=ttl;
  $('#srch').style.display=S.tab==='set'?'none':'';
  const v=$('#view');
  if(S.tab==='set'){renderSettings(v);return}
  let h='',n=0;S.dirList=[];
  if(flat){const items=flatList();n=items.length;
    h=n?'<div class="card">'+items.map(f=>fileRow(f,(relOf(f).length?relOf(f).map(clean).join(' › ')+' · ':'')+fmtSize(f.size))).join('')+'</div>':''}
  else{const {dirs,files}=browse();n=dirs.length+files.length;S.dirList=dirs;
    if(S.path.length)h+='<button class="crumb" id="back">'+ico('chev')+esc(S.path.length>1?clean(S.path[S.path.length-2]):'All files')+'</button>';
    h+=n?'<div class="card">'+dirs.map((d,i)=>'<button class="row" data-dir="'+i+'"><span class="fi dir">'+ico('folder')+'</span><span class="tx"><span class="nm">'+esc(clean(d.name))+'</span><span class="sz">'+d.count+' file'+(d.count===1?'':'s')+'</span></span>'+ico('chev','chev')+'</button>').join('')+files.map(f=>fileRow(f,fmtSize(f.size))).join('')+'</div>':''}
  if(!n){
    h+='<div class="card"><div class="empty">'+(S.files.length&&S.q?'<b>No matches</b>Try a different name.':S.tab==='fav'?'<b>No favorites yet</b>Open a file, tap the ••• button, then choose Add to Favorites.':'<b>No files yet</b>Add HTML files, or a whole folder, from the Files app, iCloud Drive or your computer.<br><button class="big" id="bigAdd">'+ico('plus')+'Add HTML files or folder</button>')+'</div></div>'}
  if(S.tab==='my'&&!standalone()&&isiOS()&&!S.tip&&S.files.length)h+='<div class="tip"><span>Tip: tap Share, then Add to Home Screen, to use this like an app.</span><button id="tipX">Hide</button></div>';
  v.innerHTML=h;
  const b=$('#bigAdd');if(b)b.onclick=addMenu;
  const bk=$('#back');if(bk)bk.onclick=()=>{S.path.pop();render();$('#home').scrollTop=0};
  const t=$('#tipX');if(t)t.onclick=()=>{S.tip=true;LS.set('tipHidden',true);render()}}

function renderSettings(v){
  const total=S.files.reduce((s,f)=>s+f.size,0);
  v.innerHTML=
   '<div class="sec"><h2>Appearance</h2><div class="card"><div class="set"><span class="lb">Theme</span><span class="seg" id="sTheme">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,l])=>'<button data-v="'+k+'" aria-pressed="'+(S.set.theme===k)+'">'+l+'</button>').join('')+'</span></div></div></div>'+
   '<div class="sec"><h2>Reading</h2><div class="card">'+
   '<div class="set"><span class="lb">Display<small>How the toolbar behaves when a page is open</small></span><select class="sel" id="sDisp" aria-label="Default display"><option value="adjacent">Adjacent</option><option value="full">Full Screen</option><option value="focus">Focus</option></select></div>'+
   '<label class="set"><span class="lb">Network access<small>Let pages load images, fonts and scripts from the internet</small></span><span class="sw"><input type="checkbox" id="sNet"><i></i></span></label>'+
   '<label class="set"><span class="lb">Fix broken images<small>Retries blocked or hot-linked images, such as AWS links, through another route</small></span><span class="sw"><input type="checkbox" id="sFix"><i></i></span></label>'+
   '<label class="set"><span class="lb">Split question points<small>Formats numbered & untagged points, tables, abbreviations, and clinical lab lines</small></span><span class="sw"><input type="checkbox" id="sFmt"><i></i></span></label>'+
   '</div></div>'+
   '<div class="sec"><h2>Storage</h2><div class="card"><div class="set"><span class="lb">'+S.files.length+' file'+(S.files.length===1?'':'s')+'<small>'+fmtSize(total)+' on this device. Files never leave it.</small></span></div>'+
   '<button class="set danger" id="sWipe">Remove all files</button></div></div>'+
   '<div class="sec"><h2>About</h2><div class="card"><div class="set"><span class="lb">'+(standalone()?'Running as an app':'Use it like an app')+'<small>'+(standalone()?'Installed on your Home Screen. Works offline for files you have added.':'In Safari tap Share, then Add to Home Screen.')+'</small></span></div></div></div>';
  $('#sDisp').value=S.set.display;$('#sNet').checked=S.set.net;$('#sFix').checked=S.set.fix;$('#sFmt').checked=S.set.fmt;
  $('#sTheme').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;S.set.theme=b.dataset.v;saveSet();applyTheme();render()};
  $('#sDisp').onchange=e=>{S.set.display=e.target.value;saveSet()};
  $('#sNet').onchange=e=>{S.set.net=e.target.checked;saveSet()};
  $('#sFix').onchange=e=>{S.set.fix=e.target.checked;saveSet()};
  $('#sFmt').onchange=e=>{S.set.fmt=e.target.checked;saveSet()};
  let armed=0;$('#sWipe').onclick=e=>{const b=e.currentTarget;if(!S.files.length){toast('There are no files to remove.');return}if(!armed){armed=1;b.textContent='Tap again to remove everything';setTimeout(()=>{armed=0;if(b.isConnected)b.textContent='Remove all files'},3500);return}
    S.files=[];DB.clear();render();toast('All files removed.')}}

$$('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='my'&&S.tab==='my')S.path=[];S.tab=b.dataset.tab;render();$('#home').scrollTop=0});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('#bAdd').onclick=addMenu;
$('#inFiles').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#inDir').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};

async function addFiles(fs){
  const total=fs.length;
  fs=fs.filter(f=>/\.(x?html?|shtml)$/i.test(f.name)||/html/.test(f.type));
  if(!fs.length){toast(total?'No .html files found in that selection.':'Choose files ending in .html or .htm.');return}
  const key=(rel,n)=>rel.join('/')+'/'+n;
  const have=new Map(S.files.map(x=>[key(relOf(x),x.name),x]));
  let add=0,upd=0;const tops=new Set();
  for(const f of fs){
    const rel=f.webkitRelativePath?f.webkitRelativePath.split('/').slice(0,-1):[];if(rel.length)tops.add(rel[0]);
    const ex=have.get(key(rel,f.name));
    if(ex){ex.blob=f;ex.size=f.size;await DB.put(ex);upd++}
    else{const rec={id:uid(),name:f.name,rel,size:f.size,blob:f,fav:false,added:Date.now()};S.files.push(rec);have.set(key(rel,f.name),rec);await DB.put(rec);add++}}
  S.tab='my';S.path=[];S.q='';$('#q').value='';
  render();
  const where=tops.size===1?' from '+clean([...tops][0]):'';
  toast(fs.length===1&&!tops.size?'Added '+clean(fs[0].name):(add?'Added '+add+' file'+(add===1?'':'s'):'')+(add&&upd?', ':'')+(upd?'Updated '+upd:'')+where);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}

/* drag and drop (desktop, iPad with trackpad) */
let dn=0;
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dn++;document.body.classList.add('dropping')}});
addEventListener('dragleave',()=>{dn=Math.max(0,dn-1);if(!dn)document.body.classList.remove('dropping')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dn=0;document.body.classList.remove('dropping');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles([...e.dataTransfer.files])});

/* tap opens, long press or right-click opens file actions */
(()=>{const v=$('#view');let timer=0,fired=false,sx=0,sy=0;
  v.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r)return;fired=false;sx=e.clientX;sy=e.clientY;timer=setTimeout(()=>{fired=true;rowSheet(r)},550)});
  const cancel=()=>clearTimeout(timer);
  v.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)cancel()});
  v.addEventListener('pointerup',cancel);v.addEventListener('pointercancel',cancel);v.addEventListener('pointerleave',cancel);
  v.addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(r){e.preventDefault();cancel();fired=true;rowSheet(r)}});
  v.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;if(fired){fired=false;return}if(r.dataset.dir!==undefined){S.path=S.dirList[+r.dataset.dir].path;render();$('#home').scrollTop=0}else openFile(r.dataset.id)})})();
function rowSheet(r){if(r.dataset.dir!==undefined)dirSheet(+r.dataset.dir);else fileSheet(r.dataset.id)}

/* ---------- reading ---------- */
function decodeBytes(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0xEF&&u[1]===0xBB&&u[2]===0xBF)return new TextDecoder('utf-8').decode(u.subarray(3));
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u.subarray(2));
  if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u.subarray(2));
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){}
  const m=/charset\s*=\s*["']?([\w-]+)/i.exec(new TextDecoder('latin1').decode(u.subarray(0,2048)));
  if(m){try{return new TextDecoder(m[1]).decode(u)}catch(e){}}
  return new TextDecoder('windows-1252').decode(u)}
function IMGFIX(){
  var P='https://wsrv.nl/?url=';
  document.addEventListener('error',function(e){
    var t=e.target;if(!t||t.tagName!=='IMG')return;
    var st=+(t.getAttribute('data-hrfix')||0),u=t.currentSrc||t.src||'';
    if(st===0){if(!/^https?:/i.test(u))return;t.setAttribute('data-hrfix','1');t.setAttribute('data-hrsrc',u);t.removeAttribute('srcset');t.referrerPolicy='no-referrer';t.src=P+encodeURIComponent(u.replace(/^https?:\/\//i,''));return}
    var o=t.getAttribute('data-hrsrc')||u;
    if(st===1){t.setAttribute('data-hrfix','2');fetch(o,{mode:'cors',referrerPolicy:'no-referrer'}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){t.src=URL.createObjectURL(b)}).catch(function(){t.setAttribute('data-hrfix','3')})}
  },true);
}
const imgfixTag='<script>('+IMGFIX.toString().replace(/\s*\n\s*/g,' ')+')()'+SCRIPT_END;
/* Runs inside the opened page. Formats match questions into tables, splits numbered and untagged points,
   formats abbreviation notes and clinical lab lines. Written without line comments because it is flattened to one line. */
function FMT(){
  var R=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx'];
  var RU=R.map(function(x){return x.toUpperCase();}),L=[],U=[],D=[],c;
  for(c=0;c<26;c++){L.push(String.fromCharCode(97+c));U.push(String.fromCharCode(65+c));}
  for(c=1;c<=30;c++){D.push(String(c));}
  var FAM=[R,RU,L,U,D];
  var MK=/(^|[\s.,;:?!])\(?([ivxIVX]{1,5}|[a-zA-Z]|\d{1,2})(\)|\.(?=\s))/g;
  var DASH=/^[-–—:]$/, ENDDASH=/[^\s][-–—:]$/, PUNCT=/[.?!:]$/;
  var STARTERS=/^(What|Which|Who|Whom|Whose|How|Why|When|Where|Identify|Choose|Select|Name|Predict|Find)$/;

  function getType(tok){
    if(/^\d+$/.test(tok))return {family:'num',val:parseInt(tok,10),raw:tok};
    var low=tok.toLowerCase();
    var romIdx=R.indexOf(low);
    if(romIdx!==-1)return {family:'rom',val:romIdx+1,upper:tok===tok.toUpperCase(),raw:tok};
    if(/^[a-zA-Z]$/.test(tok)){
      var code=low.charCodeAt(0);
      if(code>=97&&code<=104)return {family:'alpha',val:code-96,upper:tok===tok.toUpperCase(),raw:tok};
      if(code>=112&&code<=117)return {family:'pqrs',val:code-111,upper:tok===tok.toUpperCase(),raw:tok};
      return {family:'letter',val:code,upper:tok===tok.toUpperCase(),raw:tok};
    }
    return null;
  }

  function matchTable(t){
    var mkrRegex=/(?:^|[\s.,;:?!])(?:\(([1-9]|[a-zA-Z]|[ivxIVX]{1,5})\)|([1-9]|[a-zA-Z]|[ivxIVX]{1,5})([.)]))(?=\s|$)/g;
    var ms=[],m;
    while((m=mkrRegex.exec(t))!==null){
      var tok=m[1]||m[2];
      var delim=m[1]?'()':m[3];
      var at=m.index+(m[0].length-tok.length-(delim==='()'?2:1));
      ms.push({at:at,tok:tok,delim:delim});
    }
    if(ms.length<4)return null;

    for(var i=0;i<ms.length-3;i++){
      var t0=getType(ms[i].tok);
      var t1=getType(ms[i+1].tok);
      if(!t0||!t1||t0.family===t1.family)continue;
      if(t0.val===1&&t1.val===1){
        var pairs=[{left:ms[i],right:ms[i+1]}];
        var k=i+2,nextVal=2;
        while(k+1<ms.length){
          var tk0=getType(ms[k].tok);
          var tk1=getType(ms[k+1].tok);
          if(tk0&&tk1&&tk0.family===t0.family&&tk0.val===nextVal&&tk1.family===t1.family&&tk1.val===nextVal){
            pairs.push({left:ms[k],right:ms[k+1]});
            nextVal++;
            k+=2;
          }else{
            break;
          }
        }
        if(pairs.length>=2){
          var intro=t.slice(0,pairs[0].left.at).trim();
          var rows=[];
          var outro='';
          for(var p=0;p<pairs.length;p++){
            var leftStart=pairs[p].left.at;
            var rightStart=pairs[p].right.at;
            var nextStart=(p+1<pairs.length)?pairs[p+1].left.at:t.length;
            var leftText=t.slice(leftStart,rightStart).trim();
            var rightText=t.slice(rightStart,nextStart).trim();
            if(p===pairs.length-1){
              var qm=/(?:[.?!]|\s)\s*((?:What|Which|Who|Whom|Whose|How|Why|When|Where|Identify|Choose|Select|Correct|Match)\b[^?]*\??)$/i.exec(rightText);
              if(qm){
                outro=qm[1].trim();
                rightText=rightText.slice(0,qm.index).trim();
              }
            }
            rows.push({left:leftText,right:rightText});
          }
          return {type:'table',intro:intro,rows:rows,outro:outro};
        }
      }
    }

    var c1Regex=/(?:List|Column|Group)\s*[-_ ]*(1|I|A)\b[:\s]*/gi;
    var c2Regex=/(?:List|Column|Group)\s*[-_ ]*(2|II|B)\b[:\s]*/gi;
    var m1,m2,bestSeq=null;
    while((m1=c1Regex.exec(t))!==null){
      c2Regex.lastIndex=m1.index+m1[0].length;
      if((m2=c2Regex.exec(t))!==null){
        bestSeq={
          intro:t.slice(0,m1.index).trim(),
          col1Text:t.slice(m1.index+m1[0].length,m2.index).trim(),
          col2Text:t.slice(m2.index+m2[0].length).trim(),
          h1:m1[0].replace(/[:\s]+$/,''),
          h2:m2[0].replace(/[:\s]+$/,'')
        };
      }
    }
    if(bestSeq){
      var seqOutro='';
      var sqm=/(?:[.?!]|\s)\s*((?:What|Which|Who|Whom|Whose|How|Why|When|Where|Identify|Choose|Select|Correct|Match)\b[^?]*\??)$/i.exec(bestSeq.col2Text);
      if(sqm){
        seqOutro=sqm[1].trim();
        bestSeq.col2Text=bestSeq.col2Text.slice(0,sqm.index).trim();
      }
      function getListItems(str){
        var mkArr=[],ma;mkrRegex.lastIndex=0;
        while((ma=mkrRegex.exec(str))!==null){
          var mTok=ma[1]||ma[2];
          var mDelim=ma[1]?'()':ma[3];
          var mAt=ma.index+(ma[0].length-mTok.length-(mDelim==='()'?2:1));
          mkArr.push({at:mAt,tok:mTok});
        }
        if(mkArr.length<2)return null;
        var res=[];
        for(var li=0;li<mkArr.length;li++){
          var st=mkArr[li].at;
          var en=(li+1<mkArr.length)?mkArr[li+1].at:str.length;
          res.push(str.slice(st,en).trim());
        }
        return res;
      }
      var it1=getListItems(bestSeq.col1Text);
      var it2=getListItems(bestSeq.col2Text);
      if(it1&&it2&&it1.length===it2.length&&it1.length>=2){
        var seqRows=[];
        for(var si=0;si<it1.length;si++){
          seqRows.push({left:it1[si],right:it2[si]});
        }
        return {type:'table',intro:bestSeq.intro,rows:seqRows,outro:seqOutro,col1Header:bestSeq.h1,col2Header:bestSeq.h2};
      }
    }
    return null;
  }

  function points(t){
    var ms=[],m;MK.lastIndex=0;
    while((m=MK.exec(t))){ms.push({at:m.index+m[1].length,tok:m[2],d:m[3].charAt(0)});}
    for(var f=0;f<FAM.length;f++){
      for(var di=0;di<2;di++){
        var dl=di?'.':')',seq=[],n=0;
        for(var i=0;i<ms.length;i++){if(ms[i].d===dl&&n<FAM[f].length&&ms[i].tok===FAM[f][n]){seq.push(ms[i].at);n++;}}
        if(seq.length>=2){return seq;}
      }
    }
    return null;
  }

  function buildPoints(t,seq){
    var parts=[],pre=t.slice(0,seq[0]).replace(/\s+$/,'');
    if(pre){parts.push(pre);}
    for(var i=0;i<seq.length;i++){parts.push(t.slice(seq[i],i+1<seq.length?seq[i+1]:t.length).replace(/^\s+|\s+$/g,''));}
    var last=parts[parts.length-1],m=/^([^]{3,}?[.!])\s+([A-Z][^]*\?)$/.exec(last);
    if(!m){m=/^([^]{3,}?)\s+((?:What|Which|Who|Whom|Whose|How|Why|When|Where|Identify|Choose|Select|Name|Predict|Find)\b[^?]*\?)$/.exec(last);}
    if(m){parts[parts.length-1]=m[1];parts.push(m[2]);}
    return parts;
  }

  function untagged(t,optTexts){
    var qIdx=t.lastIndexOf('?');
    var splitIdx=-1;
    if(qIdx!==-1){
      splitIdx=qIdx+1;
    }else{
      var cIdx=t.lastIndexOf(':');
      if(cIdx>20&&/(following|consider|statements|options|below|criteria|features)\b/i.test(t.slice(0,cIdx))){
        splitIdx=cIdx+1;
      }
    }
    if(splitIdx===-1||splitIdx>=t.length-2)return null;

    var stem=t.slice(0,splitIdx).trim();
    var rem=t.slice(splitIdx).trim();
    if(!rem)return null;

    var abbRegex=/(?:^|\s+)([A-Za-z0-9\/+]{2,}\s*[-–—:]\s*[^–—:-]+)(?=\s+[A-Za-z0-9\/+]{2,}\s*[-–—:]|$)/g;
    var abbs=[],am;
    while((am=abbRegex.exec(rem))!==null){
      abbs.push(am[1].trim());
    }
    if(abbs.length>0&&abbs.join(' ').length>=rem.length*0.75){
      return [stem].concat(abbs);
    }

    var numInOpts=[];
    if(optTexts&&optTexts.length>0){
      for(var o=0;o<optTexts.length;o++){
        var cleanOpt=optTexts[o].replace(/^[A-D]\)\s*/i,'').trim();
        var nums=cleanOpt.match(/\b([1-9])\b/g);
        if(nums){
          nums.forEach(function(n){var v=parseInt(n,10);if(numInOpts.indexOf(v)===-1)numInOpts.push(v);});
        }
      }
      numInOpts.sort(function(a,b){return a-b;});
    }

    var targetCount=numInOpts.length>=2?Math.max.apply(null,numInOpts):0;

    var words=[],wRegex=/(\([^\)]+\)|[A-Za-z0-9+–—\/-]+(?:[^\s\(\)]*))/g,wm;
    while((wm=wRegex.exec(rem))!==null){
      words.push({word:wm[0],index:wm.index});
    }
    if(words.length<2)return null;

    var cand=[];
    for(var w=0;w<words.length;w++){
      var wd=words[w].word;
      if(/^[A-Z]/.test(wd)&&!wd.startsWith('(')){
        cand.push(w);
      }
    }

    var items=null;
    if(targetCount>=2&&cand.length===targetCount){
      items=[];
      for(var c=0;c<cand.length;c++){
        var sIdx=cand[c];
        var eIdx=(c+1<cand.length)?cand[c+1]:words.length;
        var itText=rem.slice(words[sIdx].index,(eIdx<words.length?words[eIdx].index:rem.length)).trim();
        items.push((c+1)+'. '+itText);
      }
    }else if(cand.length>=2&&cand.length<=8){
      var validPhrases=true;
      var temp=[];
      for(var c=0;c<cand.length;c++){
        var sIdx=cand[c];
        var eIdx=(c+1<cand.length)?cand[c+1]:words.length;
        var itWords=words.slice(sIdx,eIdx);
        if(itWords.length>6){validPhrases=false;break;}
        var itText=rem.slice(words[sIdx].index,(eIdx<words.length?words[eIdx].index:rem.length)).trim();
        if(/[.?!]$/.test(itText)&&c<cand.length-1){validPhrases=false;break;}
        temp.push(itText);
      }
      if(validPhrases){
        items=[];
        for(var k=0;k<temp.length;k++){
          items.push((targetCount>=2?(k+1)+'. ':'')+temp[k]);
        }
      }
    }

    if(items&&items.length>=2){
      return [stem].concat(items);
    }
    return null;
  }

  function buildLines(t){
    var tk=t.replace(/^\s+|\s+$/g,'').split(/\s+/),sp=[],le=[],st=[],i,k;
    if(tk.length<5||t.length>1200){return null;}
    for(i=0;i<tk.length-1;i++){
      if(DASH.test(tk[i])){if(i>0){sp.push(i);le.push(i-1);st.push(true);}}
      else if(ENDDASH.test(tk[i])){sp.push(i);le.push(i);st.push(false);}
    }
    var s2=[],l2=[],t2=[];
    for(k=0;k<sp.length;k++){if(!(k+1<sp.length&&sp[k+1]===sp[k]+1)){s2.push(sp[k]);l2.push(le[k]);t2.push(st[k]);}}
    sp=s2;le=l2;st=t2;
    if(sp.length<2){return null;}
    var ps=0;
    for(i=le[0]-1;i>=0;i--){if(PUNCT.test(tk[i])){ps=i+1;break;}}
    var ls=[ps];
    if(le[0]-ps+1>4){
      ls[0]=le[0];
      for(i=le[0]-3;i<=le[0];i++){if(i>=ps&&/^[A-Z]/.test(tk[i])){ls[0]=i;break;}}
    }
    if(st[0]&&!/^[A-Z]/.test(tk[ls[0]])){return null;}
    for(k=1;k<sp.length;k++){
      var vs=sp[k-1]+1,j=le[k];
      for(var x=vs+1;x<=le[k];x++){if(/^[A-Z]/.test(tk[x])){j=x;break;}}
      if(j<=vs){return null;}
      if(st[k]&&!/^[A-Z]/.test(tk[j])){return null;}
      ls.push(j);
    }
    var foot=tk.length,end=tk.length-1,lv=sp[sp.length-1]+1;
    if(/\?$/.test(tk[end])){
      for(i=lv+1;i<tk.length;i++){
        if(STARTERS.test(tk[i])||(PUNCT.test(tk[i-1])&&/^[A-Z]/.test(tk[i])&&tk[i-1]!==':')){foot=i;break;}
      }
    }
    var out=[];
    if(ls[0]>0){out.push(tk.slice(0,ls[0]).join(' '));}
    for(k=0;k<ls.length;k++){
      var e=k+1<ls.length?ls[k+1]:foot;
      out.push(tk.slice(ls[k],e).join(' '));
    }
    if(foot<tk.length){out.push(tk.slice(foot).join(' '));}
    return out;
  }

  function buildNewlines(t){
    var q=t.lastIndexOf('?');
    if(q<0){return null;}
    var tl=t.slice(q+1);
    if(tl.length<6||tl.length>500){return null;}
    var rows=tl.split(/\s*\n\s*/).filter(function(x){return /\S/.test(x);});
    if(rows.length<2||rows.length>12||rows.some(function(r){return r.length>150;})){return null;}
    return [t.slice(0,q+1).replace(/\s+$/,'')].concat(rows);
  }

  function putLines(node,parts){
    var s=document.createElement('span');s.setAttribute('data-hrp','1');
    for(var i=0;i<parts.length;i++){if(i){s.appendChild(document.createElement('br'));}s.appendChild(document.createTextNode(parts[i]));}
    node.parentNode.replaceChild(s,node);
  }

  function putTable(node,data){
    var w=document.createElement('div');w.setAttribute('data-hrp','1');w.className='hr-match-wrap';
    if(data.intro){var pi=document.createElement('div');pi.className='hr-match-intro';pi.textContent=data.intro;w.appendChild(pi);}
    var tb=document.createElement('table');tb.className='match-table';
    var thd=document.createElement('thead');var trh=document.createElement('tr');
    var th1=document.createElement('th');th1.textContent=data.col1Header||'Column I';
    var th2=document.createElement('th');th2.textContent=data.col2Header||'Column II';
    trh.appendChild(th1);trh.appendChild(th2);thd.appendChild(trh);tb.appendChild(thd);
    var tbd=document.createElement('tbody');
    for(var r=0;r<data.rows.length;r++){
      var tr=document.createElement('tr');
      var td1=document.createElement('td');td1.textContent=data.rows[r].left;
      var td2=document.createElement('td');td2.textContent=data.rows[r].right;
      tr.appendChild(td1);tr.appendChild(td2);tbd.appendChild(tr);
    }
    tb.appendChild(tbd);w.appendChild(tb);
    if(data.outro){var po=document.createElement('div');po.className='hr-match-outro';po.textContent=data.outro;w.appendChild(po);}
    node.parentNode.replaceChild(w,node);
  }

  function pass(){
    if(!document.body){return;}
    var optEls=document.querySelectorAll('.opt,.opts,.option,.options,.choice,.choices');
    var optTexts=[];
    for(var oi=0;oi<optEls.length;oi++){optTexts.push(optEls[oi].textContent||'');}

    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n,list=[];
    while((n=w.nextNode())){
      var p=n.parentNode;
      if(!p||n.nodeValue.length<9){continue;}
      if(p.closest&&p.closest('script,style,textarea,select,option,code,pre,.opt,.opts,.option,.options,.choice,.choices,.ex,.explanation,.palette,.ov,[data-hrp]')){continue;}
      list.push(n);
    }
    for(var i=0;i<list.length;i++){
      var t=list[i].nodeValue;
      var tbl=matchTable(t);
      if(tbl){putTable(list[i],tbl);continue;}
      var s=points(t);
      if(s){var parts=buildPoints(t,s);if(parts&&parts.length>1){putLines(list[i],parts);continue;}}
      var u=untagged(t,optTexts);
      if(u&&u.length>1){putLines(list[i],u);continue;}
      var l=buildLines(t)||buildNewlines(t);
      if(l&&l.length>1){putLines(list[i],l);}
    }
  }

  var tm=0;
  function sched(){clearTimeout(tm);tm=setTimeout(pass,40);}
  new MutationObserver(sched).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('DOMContentLoaded',sched);
  addEventListener('load',sched);

  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='hr-set-font'){
      var st=document.getElementById('hr-font-style');
      if(!st){st=document.createElement('style');st.id='hr-font-style';document.head.appendChild(st);}
      st.textContent=e.data.css;
    }
  });
}
const fmtTag='<script>('+FMT.toString().replace(/\s*\n\s*/g,' ')+')()'+SCRIPT_END;
const CSP_OFF='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' \'unsafe-eval\' data: blob:; style-src \'unsafe-inline\' data: blob:; img-src data: blob:; font-src data: blob:; media-src data: blob:; frame-src data: blob:; connect-src data: blob:; form-action \'none\'">';
function injectHead(t,s){
  let m=/<head\b[^>]*>/i.exec(t);if(m)return t.slice(0,m.index+m[0].length)+s+t.slice(m.index+m[0].length);
  m=/<html\b[^>]*>/i.exec(t);if(m)return t.slice(0,m.index+m[0].length)+'<head>'+s+'</head>'+t.slice(m.index+m[0].length);
  m=/<!doctype[^>]*>/i.exec(t);if(m)return t.slice(0,m.index+m[0].length)+s+t.slice(m.index+m[0].length);
  return '<!doctype html><meta charset="utf-8">'+s+t}
const SANDBOX='allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-pointer-lock allow-presentation allow-orientation-lock';

/* Font CSS generator: targets question, options, buttons below options, review & explanation without scaling the test header */
function getFontCss(pct){
  const p=+pct||100, s=p/100;
  return ':root{--hr-font-pct:'+p+'%;--hr-font-scale:'+s+';}\n'+
    'header,header *,.bar,.bar *,.brand,.brand *,.fsb,.fsb *,.x,.x *,#bar,.sec-pill,.qtop,.timer{font-size:initial;}\n'+
    'main,.qn-row,.qn,.q,.q *,.question,.question *{font-size:calc(clamp(16px,1.4vw,18.5px)*'+s+')!important;line-height:1.5!important;}\n'+
    '.qn{font-size:calc(13.5px*'+s+')!important;}\n'+
    '.opts,.opt,.options,.option,.choice{font-size:calc(clamp(15px,1.3vw,17px)*'+s+')!important;}\n'+
    '.opt .l{font-size:calc(14.5px*'+s+')!important;}\n'+
    '.nav,.nav .btn,.btn,.buttons button{font-size:calc(14px*'+s+')!important;padding:calc(9px*'+Math.min(s,1.25)+') calc(16px*'+Math.min(s,1.25)+')!important;}\n'+
    '.rv,.rv .q,.rv .opt,.ex,.ex *{font-size:calc(14.5px*'+s+')!important;}\n'+
    '.rv .q{font-size:calc(17px*'+s+')!important;}\n'+
    '.rv .opt{font-size:calc(16px*'+s+')!important;}\n'+
    '.match-table,.match-table th,.match-table td{font-size:calc(15px*'+s+')!important;}\n'+
    '.match-table{width:100%;max-width:100%;border-collapse:collapse;margin:10px 0 14px;background:#fff;border:1.5px solid #d0d7da;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);}\n'+
    '.match-table th{background:#eef3f6;color:#2c383f;font-weight:700;text-align:left;padding:8px 12px;border-bottom:2px solid #cfd7db;}\n'+
    '.match-table td{padding:8px 12px;border-bottom:1px solid #e5eaec;vertical-align:top;text-align:left;line-height:1.45;}\n'+
    '.match-table tr:last-child td{border-bottom:none;}\n'+
    '.match-table tr:nth-child(even) td{background:#f8fafb;}\n'+
    '.hr-match-intro{margin-bottom:8px;font-size:inherit;font-weight:inherit;}\n'+
    '.hr-match-outro{margin-top:10px;font-size:inherit;font-weight:600;}\n'+
    'body > :not(header):not(.bar):not(script):not(style){font-size:'+p+'%;}';
}

async function openFile(id){
  const f=S.files.find(x=>x.id===id);if(!f)return;
  S.cur=f;S.mode=S.set.display;S.net=S.set.net;
  $('#rTitle').textContent=clean(f.name);$('#reader').hidden=false;document.body.style.overflow='hidden';
  setMode(S.mode,true);await loadFrame()}
async function loadFrame(){
  const f=S.cur;if(!f)return;
  try{
    const text=decodeBytes(await f.blob.arrayBuffer());
    const fontTag='<style id="hr-font-style">'+getFontCss(S.set.font)+'</style>';
    const head=(S.net?'':CSP_OFF)+(S.net&&S.set.fix?'<meta name="referrer" content="no-referrer">'+imgfixTag:'')+fontTag+(S.set.fmt?fmtTag:'');
    const url=URL.createObjectURL(new Blob([head?injectHead(text,head):text],{type:'text/html;charset=utf-8'}));
    if(S.url)URL.revokeObjectURL(S.url);S.url=url;
    const box=$('#rframe');box.innerHTML='';
    const fr=document.createElement('iframe');fr.title=f.name;fr.setAttribute('sandbox',SANDBOX);fr.setAttribute('allow','fullscreen; autoplay; clipboard-read; clipboard-write; geolocation');fr.allowFullscreen=true;fr.src=url;box.appendChild(fr);applyFont()
  }catch(e){toast('This file could not be opened: '+e.message)}}

function setFont(p){
  p=Math.max(50,Math.min(250,Math.round(p/10)*10));
  S.set.font=p;saveSet();applyFont();
  const pct=$('#fPct');if(pct)pct.textContent=p+'%';
  const sl=$('#fSlider');if(sl&&+sl.value!==p)sl.value=p;
}
function stepFont(d){
  let p=+S.set.font||100;
  if(d==='0'||d==='100')p=100;
  else if(d==='+')p+=10;
  else if(d==='-')p-=10;
  else if(!isNaN(+d))p=+d;
  setFont(p);
}
function applyFont(){
  const fr=$('#rframe iframe');if(!fr)return;
  const p=+S.set.font||100;

function closeReader(){hideMenus();exitBrowserFull();$('#reader').hidden=true;$('#rframe').innerHTML='';if(S.url){URL.revokeObjectURL(S.url);S.url=null}S.cur=null;document.body.style.overflow='';render()}

function setMode(m,silent){
  S.mode=m;const r=$('#reader');r.dataset.mode=m;r.classList.toggle('hide-bar',m!=='adjacent');r.classList.remove('peek');

function enterBrowserFull(){try{const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn&&!document.fullscreenElement&&!document.webkitFullscreenElement){const p=fn.call(el);if(p&&p.catch)p.catch(()=>{})}}catch(e){}}

$('#layer').addEventListener('click',async e=>{

  if(a==='deldir'){hideMenus();if(S.dsel)removeDir(S.dsel);return}

  if(a==='fav'){hideMenus();toggleFav(f);return}

async function shareFile(f){
